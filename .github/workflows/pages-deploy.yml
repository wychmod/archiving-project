name: "Build and Deploy"

on:
  push:
    branches:
      - main
      - master
    # The site source lives in `showcase/`; archive-only changes must not rebuild the site.
    paths:
      - "showcase/**"
      - ".github/workflows/pages-deploy.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: showcase

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: showcase/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check content, layouts and pages
        # `astro check` validates the content-collection Zod schemas and every
        # component prop, so a malformed front matter entry or a stale prop name
        # fails here rather than rendering something subtly wrong.
        run: npm run check

      - name: Build site
        # `configure-pages` supplies the repository sub-path; astro.config.mjs
        # reads it as PAGES_BASE_PATH, so every internal link, redirect and
        # sitemap entry is emitted already prefixed with it.
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Validate internal links stay inside the deploy base
        # Replaces the old html-proofer pass. The base is passed explicitly
        # rather than inferred, so this asserts that the build used the base we
        # expected — a build that silently lost its base would otherwise
        # self-validate. The failure mode guarded against is a single
        # un-prefixed path, which only breaks after deployment.
        run: node scripts/check-links.mjs "${{ steps.pages.outputs.base_path }}"

      - name: Validate design tokens resolve
        # A `var(--x)` with no definition fails silently and drops the whole
        # declaration, so a typo looks like a styling choice rather than a bug.
        run: npm run check:tokens

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: showcase/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
