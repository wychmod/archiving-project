name: "Build and Deploy"

on:
  push:
    branches:
      - main
      - master
    # The site source lives in `showcase/`; archive-only changes must not rebuild the site.
    paths:
      - "showcase/**"
      - ".github/workflows/pages-deploy.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: showcase

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/showcase/Gemfile

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true
          working-directory: showcase

      - name: Build site
        run: bundle exec jekyll b -d "$RUNNER_ROOT/_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"
          RUNNER_ROOT: ${{ github.workspace }}

      - name: Test site
        run: |
          gem install html-proofer -v '~> 5.0' --no-document
          htmlproofer "$RUNNER_ROOT/_site${{ steps.pages.outputs.base_path }}" \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
