<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Archiving Project">
  <!--
    Brand mark: the archive box from the site header, set on an indigo squircle
    with the copper accent carried by the drawer handle. Kept as a single
    self-contained SVG so the site ships one favicon and no raster variants.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B63E8" />
      <stop offset="1" stop-color="#1B35A8" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="8" fill="url(#bg)" />

  <g
    transform="translate(6 6)"
    fill="none"
    stroke="#ffffff"
    stroke-width="1.7"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <rect x="0.6" y="2.4" width="18.8" height="5" rx="1.2" />
    <path d="M3.1 7.4V19.4h13.8V7.4" />
    <path d="M8.6 12h2.8" stroke="#E8B65C" stroke-width="2.1" />
  </g>
</svg>
